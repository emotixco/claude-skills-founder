name: Check

# Static checks only: no model calls, nothing billed, runs on every push and
# pull request. The behaviour checks live in the Benchmark workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Skill frontmatter and house style
        run: python3 .github/scripts/check_skills.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
